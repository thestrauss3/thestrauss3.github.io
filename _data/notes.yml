- title: What happens when someone clicks Save twice?
  body: >-
    Disabling the button helps with quick double-clicks. I’d also give each save
    an idempotency key so a retry after a timeout can return the first result.

- title: The bug that only showed up on Mondays
  body: >-
    A weekly report can pass every midweek test and still fail at the boundary.
    I’d start by testing Sunday night and Monday morning in the time zone the
    report uses.

- title: A faster way to find the right log line
  body: >-
    Start with a request ID. Following the same request across services gives
    you a smaller set of events to put in order.
